name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown headings, local links and pinned links
        run: python3 scripts/check_markdown.py

  library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # pnpm comes through Corepack, at the version in package.json's
      # packageManager (ADR-0013). Third-party actions are not allowed here.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Consumers install from Git and receive dist/ as committed: it must match the source.
      - name: Check dist/ matches the source
        run: pnpm build && git diff --exit-code -- dist

  # Gate for the `quality` status check that the master ruleset requires of
  # every repository. It passes only when every check above has passed.
  quality:
    needs: [markdown, library]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Documentation and library checks passed."

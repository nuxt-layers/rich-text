name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown headings, local links and external links
        run: python3 scripts/check_markdown.py

  library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # pnpm comes through Corepack, at the version in package.json's
      # packageManager (ADR-0013). Node 26 no longer bundles Corepack, and
      # third-party actions are not allowed here.
      - run: npm install --global corepack@0.36.0 && corepack enable
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # Development: resolve against package.json rather than insisting on the
      # committed lockfile (ADR-0008). minimumReleaseAge and blockExoticSubdeps
      # still apply. CI would freeze by default, so the flag is explicit.
      - run: pnpm install --no-frozen-lockfile
      - name: Show lockfile drift
        run: git diff --stat -- pnpm-lock.yaml
      - run: pnpm check
      # Consumers install from Git and receive dist/ as committed: it must match the source.
      - name: Check dist/ matches the source
        run: pnpm build && git diff --exit-code -- dist

  # Gate for the `quality` status check that the master ruleset requires of
  # every repository. It passes only when every check above has passed.
  quality:
    needs: [markdown, library]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Documentation and library checks passed."
